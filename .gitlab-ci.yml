stages:
  - build
  - push
  - deploy

variables:
  IMAGE_NAME: registry.gitlab.com/<ton_user>/<ton_projet>/parc-auto

build:
  stage: build
  script:
    - docker build -t $IMAGE_NAME .

push:
  stage: push
  script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - docker push $IMAGE_NAME

deploy:
  stage: deploy
  script:
    - docker-compose down || true
    - docker-compose up -d
